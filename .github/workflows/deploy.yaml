concurrency:
  cancel-in-progress: true
  group: "pages"
jobs:
  build:
    env:
      OUTPUT_DIRECTORY: dist
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Build app
        run: |
          cd app
          make build-image
          make update-assets
      - name: Build web
        run: |
          cd web
          make build-image
          make polish
          make build ARTIFACT_BASE=https://naokihori.github.io/NaokiHori/
      - name: Pack all artifacts
        run: |
          mkdir -p ${{ env.OUTPUT_DIRECTORY }}
          mkdir -p ${{ env.OUTPUT_DIRECTORY }}/stats
          mv app/assets/* ${{ env.OUTPUT_DIRECTORY }}/stats/
          mv web/dist/* ${{ env.OUTPUT_DIRECTORY }}/
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.OUTPUT_DIRECTORY }}
    timeout-minutes: 5
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    needs: build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
    timeout-minutes: 5
name: Deploy
on:
  push:
    branches:
      - main
  schedule:
    - cron: "34 3 * * 0"
  workflow_dispatch: {}
permissions: {}
